name: Run Android Emulator

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  android-emulator:
    runs-on: ubuntu-latest

    steps:
    # Step 1: Checkout the Code
    - name: Checkout code
      uses: actions/checkout@v3

    # Step 2: Set up Java
    - name: Set up JDK
      uses: actions/setup-java@v3
      with:
        java-version: '11'
        distribution: 'adopt'

    # Step 3: Set up Android SDK
    - name: Set up Android SDK
      uses: android-actions/setup-android@v2
      with:
        api-level: 30
        build-tools: 30.0.3
        target: default
        ndk: ''

    # Step 4: Start Android Emulator
    - name: Start Android Emulator
      run: |
        echo "Starting emulator..."
        $ANDROID_HOME/emulator/emulator -avd test -no-audio -no-window -no-snapshot-load -accel auto &
        adb wait-for-device
        adb shell input keyevent 82

    # Step 5: Run Tests
    - name: Run Tests
      run: ./gradlew connectedAndroidTest

    # Step 6: Stop Emulator
    - name: Stop Emulator
      if: always()
      run: adb -s emulator-5554 emu kill
